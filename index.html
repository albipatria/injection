<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Injection Tracker</title>
  <link rel="stylesheet" href="index.css" />

  <!-- PWA / iOS home screen app support -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Injections" />
  <link rel="apple-touch-icon" href="assets/icon.jpg" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Injection Tracker</h1>
      <p class="subtitle">Gjurmo krahun ku behet injeksioni çdo ditë</p>
      <div class="menu-wrap">
        <button id="menuBtn" class="more-btn" aria-label="Importo / Eksporto" title="Importo / Eksporto" aria-haspopup="true" aria-expanded="false">&#8943;</button>
        <div id="dataMenu" class="menu hidden" role="menu">
          <button id="importBtn" role="menuitem">Importo (JSON / CSV)</button>
          <button id="exportJson" role="menuitem">Eksporto si JSON</button>
          <button id="exportCsv" role="menuitem">Eksporto si CSV</button>
        </div>
      </div>
      <input type="file" id="importInput" accept=".json,.csv,application/json,text/csv" class="hidden" />
      <p class="toolbar-msg" id="toolbarMsg" role="status"></p>
    </header>

    <div class="date-card">
      <button id="prevDay" class="nav-btn" aria-label="Dita e mëparshme">&#8249;</button>

      <label class="date-pill" for="datePicker">
        <span id="dateLabel">—</span>
        <input type="date" id="datePicker" class="hidden-date-input" />
      </label>

      <button id="nextDay" class="nav-btn" aria-label="Dita tjetër">&#8250;</button>
      <button id="todayBtn" class="today-btn">Sot</button>
    </div>

    <div class="status-card" id="statusCard"></div>

    <div class="injection-card">
      <button id="deleteBtn" class="delete-btn hidden" aria-label="Fshi injeksionin" title="Fshi injeksionin">&#128465;</button>

      <div class="arm-visual" id="armVisual">
        <img id="armImage" src="assets/left.png" alt="Krahu i injeksionit" />
      </div>
      <div class="arm-label" id="armLabel">E MAJTË</div>
      <p class="hint">Kliko mbi imazhin për të ndryshuar krahun</p>

      <div class="form-row">
        <label for="timeInput">Ora</label>
        <input type="time" id="timeInput" />
      </div>
      <div class="form-row">
        <label for="notesInput">Shënime</label>
        <textarea id="notesInput" rows="3" placeholder="Shënime opsionale..."></textarea>
      </div>

      <div class="action-row">
        <button id="editBtn" class="edit-btn">Edito</button>
      </div>
      <button id="submitBtn" class="submit-btn">Ruaj Injeksionin</button>
      <p class="save-msg" id="saveMsg"></p>
    </div>
  </div>

  <div class="modal-overlay hidden" id="confirmOverlay">
    <div class="modal-box">
      <h2>Fshi injeksionin?</h2>
      <p>Ky veprim do të fshijë përgjithmonë regjistrimin e injeksionit për këtë ditë. Nuk mund të kthehet mbrapa.</p>
      <div class="modal-actions">
        <button id="cancelDeleteBtn" class="modal-cancel-btn">Anulo</button>
        <button id="confirmDeleteBtn" class="modal-confirm-btn">Fshi</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
